name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Ruff (lint)
        run: ruff check .

      - name: Secrets self-scan
        run: |
          if grep -rEI "api_key|secret|password|token\s*=\s*['\"][A-Za-z0-9]{12,}" --include="*.py" --include="*.json" .; then
            echo "::error::POSSIBLE SECRET FOUND"; exit 1
          fi

      - name: Pytest
        run: pytest -q

      - name: Demo smoke (reproducibility)
        run: python cli.py demo

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-json
          path: benchmark.json
